# The repo had no CI until 2026-09-15: every check it quotes in its history ran
# because someone chose to run it. This runs them on every push and PR instead.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The review-record checks and the generated-standard check are Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Audio/phrase fixtures and encoded-media checks require both binaries.
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version

      # render-health.test.ts drives render.mjs over a real headless Chrome and FAILs (never
      # skips) under CI when none launches. ubuntu-latest ships google-chrome. Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor, which Chrome's sandbox needs:
      # lift that for the job here; never pass --no-sandbox instead. Prove the launch before
      # verify so a browser problem reads as one, not as a test failure.
      - name: Browser for the render tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "no apparmor userns knob on this runner"
          google-chrome --version
          google-chrome --headless=new --dump-dom about:blank > /dev/null
          echo "google-chrome launched headless"

      - run: pnpm install --frozen-lockfile

      # The repository gate, the same command a contributor runs locally. It
      # runs the byte-copy check, the generated standard drift check, the type
      # check, the vitest suite, the build, the MCP surface check, the Python
      # review-record tests and the retention tests. Keep it one command so this
      # file cannot fall behind package.json.
      #
      # The MCP surface leg drives the built bundle over a real stdio MCP
      # session against a stubbed Kie. It catches what unit tests cannot see: a
      # capability never advertised, or an outputSchema that disagrees with the
      # structuredContent the tool actually returns, which the SDK rejects at
      # call time in front of a user.
      - name: Verify
        run: pnpm run verify

      # The skills ship as zip uploads, and a SKILL.md nested deeper than the
      # top level is rejected on upload with no other signal. Cheap to check
      # here; expensive to discover in the uploader.
      - name: Every skill has a top-level SKILL.md
        run: |
          set -euo pipefail
          status=0
          for dir in skills/*/; do
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "::error::${dir} has no top-level SKILL.md"
              status=1
            fi
          done
          exit $status
